<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漫薇｜即時財產掃描</title><style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;background:#fff4f8;color:#543146}.wrap{max-width:520px;margin:auto;padding:20px}h1{font-size:25px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 6px 24px #bd668333}#reader{width:100%}button{border:0;background:#bb5480;color:white;border-radius:12px;padding:14px;font-size:16px;width:100%;margin:10px 0}p{line-height:1.6}.error{color:#a62f49}</style></head><body><div class="wrap"><h1>漫薇｜財產 QR Code 即時掃描</h1><div class="card"><p id="msg">按下開始掃描，允許相機權限後對準財產 QR Code。</p><div id="reader"></div><button id="start">開始掃描</button><button id="stop" style="display:none;background:#777">關閉相機</button><p>支援 iPhone Safari、Android Chrome。請使用 HTTPS 開啟。</p></div></div><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const msg=document.getElementById('msg'),start=document.getElementById('start'),stop=document.getElementById('stop');
const defaultReturn='https://script.google.com/macros/s/AKfycbzZkD_uOsBHGVHWDbgV6grR1l1oqvs0pDgH8qBpc8LaeTBXELHTRYN0UTlAGQYLZc4n/exec';
const appReturn=new URLSearchParams(location.search).get('return')||defaultReturn;
let scanner=null,done=false;
function assetId(text){let raw=String(text||'').trim();try{const u=new URL(raw);return (u.searchParams.get('id')||u.searchParams.get('assetId')||'').trim()}catch(e){return /^[^\s<>]{1,100}$/.test(raw)?raw:''}}
async function close(){if(!scanner)return;let s=scanner;scanner=null;try{await s.stop()}catch(e){}try{s.clear()}catch(e){}stop.style.display='none';start.style.display='block'}
start.onclick=async()=>{start.disabled=true;msg.textContent='正在啟動相機…';try{if(!window.isSecureContext)throw Error('請使用 HTTPS');if(!window.Html5Qrcode)throw Error('掃描程式載入失敗');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},async result=>{if(done)return;const id=assetId(result);if(!id){msg.textContent='無法從 QR Code 取得財產編號';return}done=true;msg.textContent='已辨識 '+id+'，正在返回盤點頁…';await close();try{const url=new URL(appReturn);if(url.hostname!=='script.google.com')throw Error('返回網址不正確');url.searchParams.set('id',id);location.assign(url.toString())}catch(e){msg.textContent='無法返回盤點頁：'+e.message}},()=>{});start.style.display='none';stop.style.display='block';msg.textContent='請對準 QR Code'}catch(e){msg.textContent='相機無法啟動：'+(e.message||e);msg.className='error';await close();start.disabled=false}};
stop.onclick=async()=>{await close();start.disabled=false;msg.textContent='相機已關閉'};
  
window.addEventListener('load', () => {
  document.getElementById('start').click();
});

</script></body></html>
